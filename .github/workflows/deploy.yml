# Production deploy: main → migrate Neon → wrangler deploy (ARCHITECTURE §12).
# Requires repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, NEON_DATABASE_URL (direct, not pooled).
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Only deploy reviewed code from THIS repository's main branch:
    # - workflow_run: the CI run must be a `push` (not a PR — a fork can name its branch
    #   "main"), from this repo, on main, and green.
    # - workflow_dispatch: only when dispatched on refs/heads/main.
    # The `production` environment must additionally be restricted to `main` with a required
    # reviewer (docs/runbooks/deploy.md).
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      # --ignore-scripts: no dependency lifecycle scripts run with production secrets in scope.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Refuse placeholder Hyperdrive id
        run: |
          if grep -q '"id": "00000000000000000000000000000000"' apps/api/wrangler.jsonc; then
            echo "::error::Set the real Hyperdrive id in apps/api/wrangler.jsonc (docs/runbooks/deploy.md)"; exit 1
          fi
      - name: Build web assets
        run: pnpm --filter @doubtless/web build
      - name: Apply database migrations (expand-only; ADR-0002)
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - name: Deploy Worker + static assets
        working-directory: apps/api
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Post-deploy health check
        run: curl -fsS "https://doubtless.app/v1/health?deep=1"
