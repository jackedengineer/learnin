# Production deploy: main → migrate Neon → wrangler deploy (ARCHITECTURE §12).
# Requires `production` environment secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# NEON_DATABASE_URL (direct, not pooled). Setup: docs/runbooks/deploy.md.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Production preflight
    # Only deploy reviewed code from THIS repository's main branch:
    # - workflow_run: the CI run must be a `push` (not a PR — a fork can name its branch
    #   "main"), from this repo, on main, and green.
    # - workflow_dispatch: only when dispatched on refs/heads/main.
    # The `production` environment must additionally be restricted to `main` with a required
    # reviewer (docs/runbooks/deploy.md).
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      url: ${{ steps.check.outputs.url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      # Until production is provisioned this skips the deploy with a notice. A manual run
      # is an explicit request to deploy, so it fails instead.
      - id: check
        run: node .github/scripts/production-preflight.mjs
        env:
          REQUIRE_READY: ${{ github.event_name == 'workflow_dispatch' }}

  deploy:
    name: Deploy to production
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Require deploy secrets
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$NEON_DATABASE_URL" ] || missing="$missing NEON_DATABASE_URL"
          if [ -n "$missing" ]; then
            echo "::error::Missing production environment secrets:$missing (docs/runbooks/deploy.md)"
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      # --ignore-scripts: no dependency lifecycle scripts run with production secrets in scope.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Through Turbo: the web build needs the API's generated types, built first by ^build.
      - name: Build web assets
        run: pnpm turbo run build --filter=@doubtless/web
      # Before migrating: a Worker that can't bundle must not change the database.
      - name: Validate the Worker bundle (uploads nothing)
        working-directory: apps/api
        run: npx wrangler deploy --env production --dry-run --outdir "$RUNNER_TEMP/worker"
      - name: Apply database migrations (expand-only; ADR-0002)
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - name: Deploy Worker + static assets
        working-directory: apps/api
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Post-deploy health check
        run: curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "$PRODUCTION_URL/v1/health?deep=1"
        env:
          PRODUCTION_URL: ${{ needs.preflight.outputs.url }}
